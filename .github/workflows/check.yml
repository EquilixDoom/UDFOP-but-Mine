# Checks Game Guide pages in pull requests (duplicate titles, empty pages, front matter problems).
name: Check Game Guide

on:
  pull_request:
    paths:
      - 'web/guide/**'
      - 'web/playground/**'
      - 'web/style.css'
      - 'web/app.js'
      - 'tools/check_contrast.py'
      - 'web/site/**'
      - 'tools/guide.py'
      - 'CONTRIBUTORS.md'
      - 'tools/update_data.py'
      - 'tools/notes.py'
      - 'data/**'
      - 'web/data.js'
      - 'web/shards/**'

permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/guide.py --check
      - run: python tools/notes.py validate
      - run: python tools/notes.py build --check
      - run: python tools/check_contrast.py
      - name: Download the release notes (kept out of the repo) for the self-test
        run: python tools/notes.py fetch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python tools/notes.py selftest
