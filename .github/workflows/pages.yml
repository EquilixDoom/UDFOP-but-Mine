# Publishes the static site in web/ to GitHub Pages on every push to main.
name: Deploy UDFOP site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the guide landing page shows when each page was last changed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build the Game Guide and Site Guide page lists
        run: python tools/guide.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
