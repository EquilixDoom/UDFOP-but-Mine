# Publishes the static site in web/ to GitHub Pages on every push to main.
name: Deploy UDOP site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Validate the change records
        run: python tools/notes.py validate
      - name: Check the site data matches the change records
        run: python tools/notes.py build --check
      - name: Build the Game Guide and Site Guide page lists
        run: python tools/guide.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
