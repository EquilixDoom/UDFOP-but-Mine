<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Release Notes Tool</title>
<style>
:root{--bg:#f6f4ee;--fg:#1f1d19;--mut:#6b665c;--card:#fff;--line:#d9d4c7;--acc:#7a4b12;--flag:#fff1c9;--flagline:#c98a00;--ok:#e3f3df;--okline:#3c8a31;--bad:#fbe3df;--badline:#b3392b}
*{box-sizing:border-box}
:root{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:18px;margin:0 12px 0 0}
nav button{background:none;border:0;color:var(--fg);padding:6px 12px;font:inherit;cursor:pointer;border-bottom:2px solid transparent}
nav button.on{border-color:var(--acc);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px 16px 84px}
button.b,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:5px 8px}
button.b{cursor:pointer}button.b:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--bg);border-color:var(--acc)}
button:disabled{opacity:.5;cursor:default}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin:0 0 12px}
.card.ok{border-left:4px solid var(--okline)}.card.un{border-left:4px solid var(--flagline)}
.src{background:var(--bg);border-radius:4px;padding:8px;margin:6px 0 10px;white-space:pre-wrap}
.acts{display:flex;flex-wrap:wrap;gap:6px}.acts button{padding:2px 8px}
.pl{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:13px}
.pill{border:1px solid var(--line);border-radius:10px;padding:0 8px}
.pill.f{background:var(--flag);border-color:var(--flagline)}
.strip{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.strip .b{padding:2px 8px;font-size:13px}.mut2{opacity:.7;font-size:12px}
.ph{font-size:20px;margin:0}.gh{font-size:16px;margin:18px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
kbd{font:12px ui-monospace,monospace;border:1px solid var(--line);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--card)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mut)}label>*{display:block;width:100%;margin-top:2px}
.f{background:var(--flag)!important;border-color:var(--flagline)!important}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{border:1px solid var(--line);border-radius:12px;padding:1px 9px;font-size:12px;cursor:pointer;user-select:none}
.chip.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.row-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.tag{font-size:12px;border-radius:10px;padding:1px 8px;border:1px solid var(--flagline);background:var(--flag)}
.tag.new{border-color:var(--badline);background:var(--bad)}
.mut{color:var(--mut)}.log{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:4px;padding:8px;max-height:300px;overflow:auto;font:12px/1.4 ui-monospace,monospace}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px}
.warn{background:var(--bad);border:1px solid var(--badline);border-radius:4px;padding:6px 10px;margin:0 0 8px}
textarea{width:100%;min-height:80px}
#foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding:8px 16px;display:none;flex-wrap:wrap;gap:8px;align-items:center}
#foot .prog{flex:1 1 120px;height:6px;border-radius:3px;background:var(--line);overflow:hidden}#foot .prog i{display:block;height:100%;background:var(--okline)}
.rv{display:grid;grid-template-columns:minmax(240px,340px) 1fr;gap:16px;align-items:start}
#rail{max-height:calc(100vh - 220px);overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--card)}
.rv>*{min-width:0}.rv>div:first-child{position:sticky;top:64px}
.chk{display:flex;align-items:center;gap:6px;margin:0 0 6px}.chk input{width:auto;margin:0}
.rg{position:sticky;top:0;background:var(--bg);font-size:12px;font-weight:600;padding:4px 8px;border-bottom:1px solid var(--line)}
.it{display:flex;gap:8px;align-items:baseline;padding:6px 8px;border-bottom:1px solid var(--line);cursor:pointer}.it:hover{background:var(--bg)}
.it.cur{background:var(--flag);box-shadow:inset 3px 0 var(--acc)}.it.done .tx{opacity:.55}
.it .tx{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;flex:1}
.dot{flex:none;width:20px;height:20px;border-radius:10px;text-align:center;font-size:12px;line-height:20px;color:var(--mut)}
.it:not(.done) .dot:not(:empty){background:var(--flag);border:1px solid var(--flagline);color:var(--fg)}.it.done .dot{color:var(--okline)}.dot.er{background:var(--bad)!important;border-color:var(--badline)!important}
#dt{margin:0}.srcbig{font-size:17px;line-height:1.5;margin:10px 0;white-space:pre-wrap}
.out{background:var(--bg);border-left:3px solid var(--acc);padding:6px 10px;margin:0 0 12px;font-size:14px}
.fb{border-top:1px solid var(--line);padding:10px 0}.fb h4{margin:0 0 6px;font-size:14px}.fb.need h4 .why{font-weight:400;font-size:12px;color:var(--flagline);margin-left:6px}
.seg{display:flex;flex-wrap:wrap;gap:4px}.seg .b.on{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.fb input[list]{width:100%}.cls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;border-top:1px solid var(--line);padding:10px 0}.cell{font-size:13px;color:var(--fg);font-weight:600}.cell select{margin-top:4px;font-weight:400}.cell .mut2{display:block;font-weight:400;margin-top:3px}.cell.need select{border-color:var(--flagline);background:var(--flag)}.cell .why{display:inline;width:auto;margin:0 0 0 6px;font-weight:400;font-size:12px;color:var(--flagline)}
.ev{margin-top:8px;font-size:13px;background:var(--bg);border-radius:4px;padding:6px 10px}.clamp3{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.ev ul{margin:4px 0 0;padding-left:18px}.ev li{margin:2px 0}
.fine{border-top:1px solid var(--line);padding:10px 0;font-size:13px}
.acts.big{border-top:1px solid var(--line);padding-top:12px;gap:8px}.acts.big button{padding:6px 14px}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}.tchip{border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;background:var(--card);max-width:100%}.tchip:hover{border-color:var(--acc)}.tchip.on{border-color:var(--acc);background:var(--flag)}.tchip .rs{display:block;font-size:12px;color:var(--mut)}
.trow{display:flex;gap:6px}.trow input{flex:1;min-width:0}.picker{border:1px solid var(--line);border-radius:6px;margin-top:6px;padding:6px}.picker #pl{max-height:260px;overflow:auto;margin-top:6px}.pk{padding:5px 8px;border-bottom:1px solid var(--line);cursor:pointer}.pk:hover{background:var(--flag)}
.kw{text-decoration:underline dotted;text-underline-offset:3px}.kw.cur{background:rgba(122,75,18,.18);text-decoration:underline}
.keys{font-size:12px}.pri kbd{background:transparent;color:inherit;border-color:currentColor}
.raw{font:15px/1.5 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word;background:var(--bg);border-radius:4px;padding:10px;margin:4px 0 10px}.ctx{max-height:340px;overflow:auto;position:relative;font-size:14px}.ctx .hd{color:var(--mut)}mark.hit{display:block;background:var(--flag);color:var(--fg);border-left:3px solid var(--flagline);margin-left:-10px;padding-left:7px}.sec summary{cursor:pointer;font-size:12px;color:var(--mut)}.sec .raw{font-size:12px;max-height:260px;overflow:auto}.sec .raw b{background:var(--flag)}
@media(max-width:760px){.rv{grid-template-columns:1fr}.rv>div:first-child{position:static}#rail{max-height:240px}}
</style>
</head>
<body>
<header><h1>Release Notes Tool</h1>
<nav><button data-t="home" class="on">1 Get notes</button><button data-t="rows">2 Review rows</button><button data-t="desc">3 Descriptions</button><button data-t="fin">4 Build &amp; check</button></nav>
<span id="stat" class="mut"></span></header>
<main id="m"></main>
<div id="foot"></div>
<script>
"use strict";
var S = null, rows = [], skipped = [], tab = "home", logTxt = "", busy = false, saveT = null, D = null, cur = -1, CHK = null, HUBS = {}, seq = 0, UNDO = null, SUM = null, CH = [], dshow = 25, mode = "draft", DR = null, ST = null, stv = "", stOnly = false, buildDue = false, sbusy = 0;
var $ = function (s) { return document.querySelector(s); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function api(path, body) {
  return fetch(path, body === undefined ? undefined : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}
function load() {
  return api("/api/state").then(function (s) {
    var dr = s.draft.map(function (r) { r._confirmed = !!s.confirmed[r.id]; return r; });
    S = s; HUBS = s.hubs || HUBS;
    if (mode === "stored") { DR = { rows: dr, skipped: s.skipped, check: s.check }; } else { CHK = s.check; rows = dr; skipped = s.skipped; }
    render();
  });
}
function save() {
  if (mode === "stored") return saveStoredSoon();
  clearTimeout(saveT);
  saveT = setTimeout(function () {
    var n = ++seq;
    api("/api/save", { rows: rows, skipped: skipped, hubs: HUBS }).then(function (x) { if (n === seq && x.check) { CHK = x.check; refreshNotes(); } });
  }, 500);
}
function run(cmd) {
  busy = true; logTxt = "Running " + cmd + "…"; render();
  return api("/api/run", { cmd: cmd }).then(function (r) {
    logTxt = r.out; busy = false;
    return load().then(function () { if (cmd === "prepare") return leaveStored().then(function () { if (rows.length) { tab = "rows"; render(); } }); });
  });
}
function staleBanner() {
  return S && S.draft_stale ? '<div class="warn">This draft is for releases that are already ingested (' + esc(versions().join(", ")) + '), so none of it can be ingested. <button class="b" data-a="discard">Discard this draft</button></div>' : "";
}
function replaceOk() { return !rows.length || (S && S.draft_stale) || confirm("A draft with " + rows.length + " rows exists. Preparing again replaces it. Continue?"); }
function fetchPrepare() {
  if (!replaceOk()) return;
  busy = true; logTxt = "Fetching…"; render();
  api("/api/run", { cmd: "fetch" }).then(function (a) {
    logTxt = a.out;
    if (!a.ok) return;
    return load().then(function () {
      if (!S.pending.length) return;
      logTxt += "\n\nPreparing…"; render();
      return api("/api/run", { cmd: "prepare" }).then(function (p) {
        logTxt += "\n" + p.out;
        return load().then(leaveStored).then(function () { if (rows.length) tab = "rows"; });
      });
    });
  }).then(function () { busy = false; render(); });
}
/* ---------- stored patches: review of rows already in the wiki's data ---------- */
var stT = null;
function saveStoredSoon() { clearTimeout(stT); stT = setTimeout(flushStored, 600); }
function flushStored() {
  clearTimeout(stT); stT = null;
  if (mode !== "stored" || !rows.length) return Promise.resolve();
  var payload = { rows: rows.map(function (r) { return { id: r.id, entity: r.entity, change_type: r.change_type, tags: r.tags, platforms: r.platforms, _confirmed: !!r._confirmed }; }), hubs: HUBS, version: pv }, n = ++seq, v0 = pv;
  return api("/api/stored/save", payload).then(function (x) {
    if (!x.ok) { logTxt = x.out; alert(x.out); return; }
    if (x.changed) buildDue = true;
    ST = x.index; S.topics = x.topics;
    if (mode === "stored" && n === seq && pv === v0) { CHK = x.check; refreshNotes(); }
    stat(); bar();
  });
}
function enterStored() {
  if (mode === "stored") return;
  DR = { rows: rows, skipped: skipped, check: CHK, cur: cur, pv: pv };
  mode = "stored"; rows = []; skipped = []; cur = -1; render();
  api("/api/stored").then(function (x) {
    ST = x;
    var first = x.versions.filter(function (v) { return v.done < v.n; })[0] || x.versions[x.versions.length - 1];
    if (first) loadStored(first.version);
  });
}
function leaveStored() {
  if (mode !== "stored") return Promise.resolve();
  return flushStored().then(function () {
    mode = "draft"; rows = DR.rows; skipped = DR.skipped; CHK = DR.check; cur = -1; pv = DR.pv || ""; DR = null; render();
  });
}
function loadStored(v) {
  return flushStored().then(function () { return api("/api/stored/rows", { version: v }); }).then(function (x) {
    stv = pv = v; rows = x.rows; CHK = x.check; cur = -1; render(); window.scrollTo(0, 0);
  });
}
function storedDone() {
  if (!ST) return 0;
  return ST.versions.reduce(function (a, v) { return a + (v.version === pv ? rows.filter(function (r) { return r._confirmed; }).length : v.done); }, 0);
}
/* ---------- undo (one level) ---------- */
function snap(label) { UNDO = { label: label, data: JSON.stringify({ rows: rows, skipped: skipped }) }; }
function undo() {
  if (!UNDO) return;
  var d = JSON.parse(UNDO.data); rows = d.rows; skipped = d.skipped; UNDO = null; cur = -1; save(); render();
}
/* ---------- helpers ---------- */
function isNew(t) { return !S.topics.some(function (x) { return x.name === t; }); }
function flagged(r, f) { return (r._review || []).indexOf(f) >= 0; }
function isLong(r) { return r.source.length > 300 || (r.source.match(/[.!?] [A-Z]/g) || []).length >= 3; }
function flagsOf(r) {
  if (mode === "stored") return [];
  var fl = (r._review || []).filter(function (f) { return f !== "summary"; });
  if (isLong(r) && fl.indexOf("split") < 0) fl.push("split?");
  return fl;
}
function hasTopic(r) { return !!r.entity && r.entity !== "TODO"; }
function errsOf(r) { return (CHK && CHK.rows[r.id] && CHK.rows[r.id].errs) || []; }
function safe(r) { return !r._confirmed && hasTopic(r) && !isNew(r.entity) && !flagsOf(r).length && !errsOf(r).length; }
/* Review is one patch at a time, laid out like the wiki's patch page: headings by kind of change, in the same order. */
var TG = [["Additions", ["New"]], ["Reworks", ["Rework"]], ["Fixes", ["Fix"]], ["Performance", ["Performance"]], ["Economy", ["Economy"]],
  ["Interface and quality of life", ["UI", "QoL"]], ["Balance (buffs and nerfs)", ["Buff", "Nerf"]], ["Removals", ["Removal"]], ["Other changes", ["Other"]]];
var pv = "";
function gOf(r) { for (var k = 0; k < TG.length; k++) if (TG[k][1].indexOf(r.change_type) >= 0) return k; return TG.length - 1; }
function versions() {
  if (mode === "stored") return ST ? ST.versions.map(function (v) { return v.version; }) : [];
  var v = []; rows.forEach(function (r) { if (v.indexOf(r.version) < 0) v.push(r.version); }); return v;
}
function verDone(v) {
  if (mode === "stored") { if (v === pv) return rows.length > 0 && rows.every(function (r) { return r._confirmed; }); var e = ST && ST.versions.filter(function (x) { return x.version === v; })[0]; return !!e && e.done >= e.n; }
  return rows.every(function (r) { return r.version !== v || r._confirmed; });
}
function curVer() {
  if (mode === "stored") return pv;
  var vs = versions();
  if (vs.indexOf(pv) < 0) pv = vs.filter(function (v) { return !verDone(v); })[0] || vs[0] || "";
  return pv;
}
function patchRows() {
  var v = curVer(), o = [];
  rows.forEach(function (r, i) { if (r.version === v) o.push(i); });
  return o.sort(function (a, b) { return gOf(rows[a]) - gOf(rows[b]) || a - b; });
}
/* the first row not yet confirmed (index 0 counts), else the first row, else -1 */
function firstOpen(l) { var o = l.filter(function (j) { return !rows[j]._confirmed; }); return o.length ? o[0] : l.length ? l[0] : -1; }
function patchDone() { return verDone(curVer()); }
function gotoPatch(v) { if (mode === "stored") return loadStored(v); pv = v; cur = -1; render(); window.scrollTo(0, 0); }
function nextPatch() {
  var vs = versions(), at = vs.indexOf(curVer()), rest = vs.slice(at + 1).concat(vs.slice(0, at));
  var nx = rest.filter(function (v) { return !verDone(v); })[0] || vs[at + 1];
  if (nx) gotoPatch(nx);
}
/* every release is the tag app-v plus its version (as on the site) */
function relLink(v) { return '<a href="https://github.com/Lattymoy/daggerfall-js-source/releases/tag/app-v' + encodeURIComponent(v) + '" target="_blank" rel="noopener" title="The developers\' original release notes for patch ' + esc(v) + ', on GitHub">Open the release on GitHub ↗</a>'; }
function shown(r) { return r.source.replace(/\*\*/g, "").replace(/`/g, ""); }  /* the site drops these marks (tools/update_data.py) */
/* ---------- views ---------- */
function stat() {
  if (mode === "stored" && ST) { $("#stat").textContent = "Stored patches: " + storedDone() + " of " + ST.total + " rows confirmed" + (buildDue ? " · stored data changed, run Build" : ""); return; }
  var un = rows.filter(function (r) { return !r._confirmed; }).length;
  $("#stat").textContent = S ? S.rows_total + " rows stored, newest " + S.last_version + " · " + S.pending.length + " pending · " + (rows.length ? un + " of " + rows.length + " draft rows unconfirmed" : "no draft") : "";
}
function bar() {
  var f = $("#foot");
  if (tab !== "rows" || !rows.length) { f.style.display = "none"; return; }
  if (mode === "stored") {
    var sd = storedDone(), left = rows.filter(function (r) { return !r._confirmed; }).length;
    f.style.display = "flex";
    f.innerHTML = '<div class="prog"><i style="width:' + Math.round(100 * sd / ST.total) + '%"></i></div><span>' + sd + " / " + ST.total + " confirmed</span>" +
      (buildDue ? '<span class="tag new">stored data changed: run Build</span>' : "") +
      '<button class="b" data-a="nextpatch">Next patch →</button>' +
      '<button class="b pri" data-a="confall"' + (left ? "" : " disabled") + '>Confirm the ' + left + " left in this patch</button>";
    return;
  }
  var un = rows.filter(function (r) { return !r._confirmed; }).length, n = patchRows().filter(function (j) { return safe(rows[j]); }).length, done = rows.length - un, er = rows.filter(function (r) { return errsOf(r).length; }).length;
  f.style.display = "flex";
  f.innerHTML = '<div class="prog"><i style="width:' + Math.round(100 * done / rows.length) + '%"></i></div><span>' + done + " / " + rows.length + " confirmed</span>" + (er ? '<span class="tag new">' + er + " with errors</span>" : "") +
    (UNDO ? '<button class="b" data-a="undo" title="Undo the last change of this kind (Z)">Undo ' + esc(UNDO.label) + "</button>" : "") +
    (patchDone() && versions().length > 1 ? '<button class="b" data-a="nextpatch">Next patch →</button>' : "") +
    '<button class="b" data-a="confsafe"' + (n ? "" : " disabled") + ' title="Rows of this patch whose topic already exists and that nothing flagged">Confirm ' + n + " unflagged here</button>" +
    '<button class="b pri" data-a="ingest"' + (un || er || busy ? " disabled" : "") + ' title="' + (un ? un + " row(s) still need confirming" : er ? er + " row(s) have errors" : "Write the rows to the wiki data") + '">Ingest ' + rows.length + " rows</button>";
}
function render() {
  document.querySelectorAll("nav button").forEach(function (b) { b.classList.toggle("on", b.dataset.t === tab); });
  stat();
  var v = { home: home, rows: reviewView, desc: descView, fin: finView }[tab];
  var scroll = window.scrollY; $("#m").innerHTML = v(); window.scrollTo(0, scroll);
  bar();
  if (tab === "rows") showHit();
  if (tab === "desc" && !D) loadDesc();
  if (tab === "fin" && !SUM) loadSum();
}
function logBox() { return logTxt ? '<div class="log">' + esc(logTxt) + "</div>" : ""; }
function home() {
  var h = '<div class="card"><b>Step 1.</b> Download new releases from GitHub and build the draft rows. The draft is rule-based guesses: nothing is final until you confirm each row.<div class="bar" style="margin-top:8px">' +
    '<button class="b pri" data-a="fetchprep"' + (busy ? " disabled" : "") + '>Fetch &amp; prepare</button>' +
    '<button class="b" data-a="run" data-c="fetch"' + (busy ? " disabled" : "") + '>Fetch only</button>' +
    '<button class="b" data-a="run" data-c="prepare"' + (busy || !S.pending.length ? " disabled" : "") + '>Prepare only</button></div>';
  if (!S.have_notes) h += '<div class="warn">data/release_notes.md is missing. Press Fetch.</div>';
  if (S.behind) h += '<div class="warn">Local notes end at ' + esc(S.behind[0]) + " but rows reach " + esc(S.behind[1]) + ". Press Fetch.</div>";
  h += "<p>Pending releases: " + (S.pending.length ? S.pending.map(function (p) { return "<b>" + esc(p.version) + "</b> (" + esc(p.date) + (p.body ? "" : ", PR titles only") + ")"; }).join(", ") : "none") + "</p>";
  if (rows.length) h += "<p>A draft with " + rows.length + ' rows is waiting. <button class="b" data-a="tab" data-t="rows">Review rows →</button></p>';
  return staleBanner() + h + "</div>" + logBox();
}
var TC = {}, RC = {}, hide = false;
function rawInfo(r) {
  var k = r.version + "|" + r.source;
  if (!(k in RC)) { RC[k] = null; api("/api/raw", { version: r.version, text: r.source }).catch(function () { return {}; }).then(function (x) { RC[k] = x.found ? x : { found: false }; paintDetail(); }); }
  return RC[k];
}
var pickOpen = false, pickQ = "", pickH = "";
function pickList(i) {
  var inPatch = {}, q = pickQ.trim().toLowerCase();
  patchRows().forEach(function (j) { inPatch[rows[j].entity] = (inPatch[rows[j].entity] || 0) + 1; });

    '<div id="dall" class="card ok" style="display:' + (left ? "none" : "block") + '">All saved. <button class="b pri" data-a="tab" data-t="fin">Go to Build →</button></div>' +
    '<div class="card"><div class="bar"><button class="b" data-a="promptall">Copy one prompt for the ' + shu + ' shown</button><span class="mut" id="pam"></span></div>' +
    '<textarea id="paste" placeholder="Paste the reply here, one line per topic: Topic ||| description"></textarea>' +
    '<div class="bar" style="margin:6px 0 0"><button class="b" data-a="paste">Fill the boxes from the paste</button><span class="mut" id="psm"></span></div></div>';
  sh.forEach(function (i) { h += descCard(D[i], i); });
  if (left > shu) h += '<div class="bar"><button class="b" data-a="dmore">Show ' + Math.min(25, left - shu) + " more (" + (left - shu) + " not shown)</button></div>";
  return h;
}
function saveDesc(j, txt) {
  return api("/api/describe/save", { topic: D[j].topic, text: txt }).then(function (x) {
    var m = $("#dm" + j);
    if (!x.ok) { m.textContent = x.out; return; }
    D[j].saved = true; D[j].draft = txt; m.textContent = "Saved.";
    var card = document.querySelector('.card[data-d="' + j + '"]'); card.classList.add("ok");
    var nx = D.findIndex(function (d, k) { return k > j && !d.saved; }); if (nx < 0) nx = D.findIndex(function (d) { return !d.saved; });
    if (nx >= 0) document.querySelector('.card[data-d="' + nx + '"]').scrollIntoView({ block: "start", behavior: "smooth" });
    else $("#dall").style.display = "block";
  });
}
function pasteFill() {
  var n = 0, bad = [];
  $("#paste").value.split(/\r?\n/).forEach(function (line) {
    var k = line.indexOf("|||"); if (k < 0) return;
    var name = line.slice(0, k).replace(/^[\s\-*#"`]+|[\s"`]+$/g, "").toLowerCase(), txt = line.slice(k + 3).trim();
    var sh = descShown(), j = sh.filter(function (i) { return D[i].topic.toLowerCase() === name; })[0];
    if (j === undefined) j = -1;
    if (j < 0 || !txt) return bad.push(line.slice(0, k).trim());
    D[j].draft = txt; D[j].saved = false; n++;
    var ta = document.querySelector('textarea[data-d="' + j + '"]'); if (ta) ta.value = txt;
    var card = document.querySelector('.card[data-d="' + j + '"]'); if (card) card.classList.remove("ok");
    $("#dm" + j).textContent = "Filled, not saved.";
  });
  $("#psm").textContent = n + " filled" + (bad.length ? ", no match for: " + bad.join(", ") : "") + ". Check each, then Save.";
}
function loadDesc() { api("/api/describe").then(function (d) { D = d; render(); }); }
function finView() {
  var h = '<div class="card"><b>Step 4.</b> Rebuild the site data, validate it and run the self-test.<div class="bar" style="margin-top:8px"><button class="b pri" data-a="checks"' + (busy ? " disabled" : "") + '>Build, validate and self-test</button>' +
    '<button class="b" data-a="run" data-c="build"' + (busy ? " disabled" : "") + '>Build only</button><button class="b" data-a="run" data-c="validate"' + (busy ? " disabled" : "") + '>Validate only</button><button class="b" data-a="run" data-c="selftest"' + (busy ? " disabled" : "") + '>Self-test only</button></div>' +
    (CH.length ? '<div class="bar">' + CH.map(function (c) { return '<span class="tag" style="background:var(' + (c.ok ? "--ok);border-color:var(--okline" : "--bad);border-color:var(--badline") + ')">' + (c.ok ? "✓ " : "✗ ") + esc(c.cmd) + "</span>"; }).join("") + "</div>" : "") + "</div>";
  if (SUM && SUM.versions.length) {
    var ty = Object.keys(SUM.types).sort(function (x, y) { return SUM.types[y] - SUM.types[x]; }).map(function (k) { return k + " " + SUM.types[k]; }).join(" · ");
    h += '<div class="card"><b>Last ingest:</b> ' + SUM.n + " rows in " + esc(SUM.versions.join(", ")) + "<br>" + esc(ty) +
      (SUM.new_topics.length ? "<br>New topics: " + SUM.new_topics.map(function (x) { return esc(x.topic) + ' <span class="mut">(' + esc(x.hub) + ")</span>"; }).join(", ") : "<br>No new topics.") +
      '<div class="bar" style="margin-top:8px">' + SUM.versions.slice(-4).map(function (v) { return '<a href="/site/#/patch/' + esc(v) + '" target="_blank">Patch ' + esc(v) + "</a>"; }).join(" · ") +
      ' · <a href="/site/#/patchnotes" target="_blank">Patch Notes page</a> · <a href="/site/#/patches" target="_blank">Patch index</a></div>' +
      '<p class="mut">Look at "Other changes" on the patch page, and at the Legacy candidates in the build log. Commit and push are yours to do.</p></div>';
  }
  return h + logBox();
}
function loadSum() { api("/api/summary").then(function (x) { SUM = x; if (tab === "fin") render(); }); }
function runChecks() {
  buildDue = false; busy = true; CH = []; logTxt = ""; render();
  var seq_ = ["build", "validate", "selftest"];
  (function next(k) {
    if (k >= seq_.length) { busy = false; return load().then(loadSum); }
    logTxt += (logTxt ? "\n\n" : "") + "== " + seq_[k] + " ==\n"; render();
    return api("/api/run", { cmd: seq_[k] }).then(function (r) {
      logTxt += r.out; CH.push({ cmd: seq_[k], ok: r.ok });
      if (!r.ok) { busy = false; return load(); }
      return next(k + 1);
    });
  })(0);
}
/* ---------- events ---------- */
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-a],nav button"); if (!t) return;
  if (t.tagName === "BUTTON") t.blur();
  if (t.matches("nav button")) { tab = t.dataset.t; return render(); }
  var a = t.dataset.a, i = +t.dataset.i, r = rows[i];
  if (a === "tab") { tab = t.dataset.t; return render(); }
  if (a === "fetchprep") return fetchPrepare();
  if (a === "checks") return runChecks();
  if (a === "run") return t.dataset.c === "prepare" && !replaceOk() ? undefined : run(t.dataset.c);
  if (a === "tag" || a === "plat") {
    var k = a === "tag" ? "tags" : "platforms", v = t.dataset.v, p = r[k].indexOf(v);
    if (p >= 0) r[k].splice(p, 1); else { if (k === "tags" && r.tags.length >= 3) return alert("At most 3 tags."); r[k].push(v); }
    if (k === "platforms" && !r.platforms.length) r.platforms = ["all"];
    if (k === "platforms" && v !== "all" && r.platforms.indexOf("all") >= 0 && r.platforms.length > 1) r.platforms.splice(r.platforms.indexOf("all"), 1);
    r._confirmed = false; save(); return setCur(i);
  }
  if (a === "conf") return confirmRow(i);
  if (a === "sug") { pickOpen = false; return setField(i, "entity", t.dataset.v); }
  if (a === "pick") { pickOpen = !pickOpen; pickQ = ""; setCur(i); var pq = $("#pq"); if (pq) pq.focus(); return; }
  if (a === "sel") return setCur(i);
  if (a === "set") return setField(i, t.dataset.f, t.dataset.v);
  if (a === "open") { r._open = !r._open; return setCur(i); }
  if (a === "undo") return undo();
  if (a === "mode") return t.dataset.m === "stored" ? enterStored() : leaveStored();
  if (a === "prevpatch" || a === "nextold") {
    var vl = ST.versions.filter(function (v) { return !stOnly || v.done < v.n || v.version === pv; }).map(function (v) { return v.version; }), q2 = vl.indexOf(pv) + (a === "prevpatch" ? -1 : 1);
    if (vl[q2]) loadStored(vl[q2]); return;
  }
  if (a === "confall") { if (!confirm("Confirm all " + rows.filter(function (x) { return !x._confirmed; }).length + " remaining rows of this patch as they are?")) return; rows.forEach(function (x) { x._confirmed = true; }); cur = -1; save(); return render(); }
  if (a === "discard") { if (!confirm("Discard the draft of " + rows.length + " rows and its confirmations?")) return; return api("/api/discard", {}).then(function (x) { logTxt = x.out; cur = -1; pv = ""; return load(); }); }
  if (a === "patch") return gotoPatch(t.dataset.v);
  if (a === "nextpatch") return nextPatch();
  if (a === "confsafe") { snap("batch confirm"); patchRows().forEach(function (j) { if (safe(rows[j])) rows[j]._confirmed = true; }); cur = -1; save(); return render(); }
  if (mode === "stored" && (a === "split" || a === "del")) return;
  if (a === "split") { snap("split"); var c2 = JSON.parse(JSON.stringify(r)); c2._confirmed = false; c2._open = true; r._confirmed = false; rows.splice(i + 1, 0, c2); renum(); cur = i + 1; save(); return render(); }
  if (a === "del") { snap("leave out"); skipped.push({ version: r.version, section: null, text: r.source }); rows.splice(i, 1); renum(); cur = Math.min(i, rows.length - 1); save(); return render(); }
  if (a === "restore") {
    var s = skipped[+t.dataset.j]; snap("add back");
    return api("/api/restore", { version: s.version, text: s.text, section: s.section }).then(function (x) {
      if (!x.row) return alert("Could not make a row.");
      var at = rows.map(function (q) { return q.version; }).lastIndexOf(s.version); rows.splice(at + 1, 0, x.row); skipped.splice(+t.dataset.j, 1); renum(); save(); render();
    });
  }
  if (a === "ingest") {
    clearTimeout(saveT); busy = true; logTxt = "Ingesting…"; render();
    return api("/api/ingest", { rows: rows, skipped: skipped }).then(function (x) {
      logTxt = x.out; busy = false; D = null;
      return load().then(function () { if (x.ok) { tab = "desc"; render(); } });
    });
  }
  if (a === "dmore") { dshow += 25; return render(); }
  if (a === "promptall") return api("/api/prompt_all", { topics: descShown().filter(function (i) { return !D[i].saved; }).map(function (i) { return D[i].topic; }) }).then(function (x) { copy(x.prompt); $("#pam").textContent = "Prompt copied."; });
  if (a === "paste") return pasteFill();
  if (a === "dkeep") { var q = +t.dataset.d; return saveDesc(q, D[q].current); }
  if (a === "prompt") { var d = D[+t.dataset.d]; return api("/api/prompt", { topic: d.topic }).then(function (x) { copy(x.prompt); $("#dm" + t.dataset.d).textContent = "Prompt copied."; }); }
  if (a === "dsave") { var j = +t.dataset.d; return saveDesc(j, document.querySelector('textarea[data-d="' + j + '"]').value); }

});
document.addEventListener("change", function (e) {
  var t = e.target;
  if (t.id === "ph") { pickH = t.value; $("#pl").innerHTML = pickList(+$("#pl").dataset.i); return; }
  if (t.id === "hide") { hide = t.checked; return render(); }
  if (t.id === "stsel") return loadStored(t.value);
  if (t.id === "stonly") { stOnly = t.checked; return render(); }
  if (t.dataset.h !== undefined) { HUBS[t.dataset.h] = t.value; return save(); }
  if (t.dataset.f) setField(+t.dataset.i, t.dataset.f, t.value);
});
document.addEventListener("keydown", function (e) {
  if (tab !== "rows" || e.ctrlKey || e.metaKey || e.altKey) return;
  var t = e.target;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) { if (e.key === "Escape" || (e.key === "Enter" && t.tagName === "INPUT")) t.blur(); return; }
  if (t.tagName === "BUTTON" || cur < 0 || !rows[cur]) return;
  var list = vis(), p = list.indexOf(cur), k = e.key.toLowerCase(), r = rows[cur], ok = true;
  if (k === "j" || k === "arrowdown") { if (list[p + 1] !== undefined) setCur(list[p + 1]); }
  else if (k === "k" || k === "arrowup") { if (p > 0) setCur(list[p - 1]); }
  else if (k === "enter" || k === " ") confirmRow(cur);
  else if (k === "z") { if (mode !== "stored") undo(); }
  else if (k === "]") nextPatch();
  else if (k === "[") { var vs = versions(), at = vs.indexOf(curVer()); if (at > 0) gotoPatch(vs[at - 1]); }
  else if (k === "u") { if (r._confirmed) confirmRow(cur); }
  else if (k === "e") { r._open = !r._open; setCur(cur); }
  else if (k === "escape") { if (r._open) { r._open = false; setCur(cur); } }
  else if (k === "t") { r._open = true; setCur(cur); var inp = $('#dt input[data-f="entity"]'); if (inp) { inp.focus(); inp.select(); } }
  else if (k === "s") { if (mode !== "stored") $('#dt [data-a="split"]').click(); }
  else if (k === "x") { if (mode !== "stored") $('#dt [data-a="del"]').click(); }
  else ok = false;
  if (ok) e.preventDefault();
});
document.addEventListener("input", function (e) {
  var t = e.target;
  if (t.id === "pq") { pickQ = t.value; $("#pl").innerHTML = pickList(+$("#pl").dataset.i); return; } if (t.dataset.d !== undefined && t.tagName === "TEXTAREA") D[+t.dataset.d].draft = t.value; });
function renum() { var n = {}; rows.forEach(function (r) { n[r.version] = (n[r.version] || 0) + 1; r.id = r.version + "-" + ("00" + n[r.version]).slice(-3); }); }
function copy(txt) {
  if (navigator.clipboard) return navigator.clipboard.writeText(txt);
  var a = document.createElement("textarea"); a.value = txt; document.body.appendChild(a); a.select(); document.execCommand("copy"); a.remove();
}
load().then(function () { if (rows.length) { tab = "rows"; render(); } });
</script>
